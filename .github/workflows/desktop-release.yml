name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release configuration
        shell: bash
        run: |
          if [ -z "${VITE_API_URL// }" ]; then
            echo "Configure a repository variable named VITE_API_URL before publishing." >&2
            exit 1
          fi

          if [[ "$VITE_API_URL" != https://* ]]; then
            echo "VITE_API_URL must use HTTPS for a production release." >&2
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          expected_tag="v${version}"

          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version ${version}. Expected ${expected_tag}." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        env:
          VITE_API_URL: http://localhost:3001
        run: pnpm test

  release:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis,msi
            rust_targets: ""
          - name: macOS
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.name }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Linvo Desktop ${{ github.ref_name }}
          releaseBody: |
            Baixe o instalador do Linvo Desktop nos arquivos abaixo.

            - Windows: `.msi` ou setup `.exe`
            - macOS: `.dmg` universal (Apple Silicon + Intel)

            No Mac sem assinatura Apple, na primeira abertura use clique direito → Abrir.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
