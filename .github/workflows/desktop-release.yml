name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows installers
    runs-on: windows-latest

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_URL)) {
            throw "Configure a repository variable named VITE_API_URL before publishing."
          }

          if (-not $env:VITE_API_URL.StartsWith("https://")) {
            throw "VITE_API_URL must use HTTPS for a production release."
          }

          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json
          $expectedTag = "v$($config.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $($config.version). Expected $expectedTag."
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis,msi
          tagName: ${{ github.ref_name }}
          releaseName: Linvo Desktop ${{ github.ref_name }}
          releaseBody: Baixe o instalador do Linvo Desktop nos arquivos abaixo.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
