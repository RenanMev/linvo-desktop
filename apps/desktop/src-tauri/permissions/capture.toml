# Todo comando do app precisa de uma permissão aqui E de uma entrada em
# `capabilities/default.json`. O `__app-acl__` não tem `default_permission`, ou
# seja, nada é liberado por omissão: um comando sem par nos dois arquivos é
# recusado no `invoke`, em silêncio, com a mensagem "not allowed". Foi o que
# aconteceu com o recorte do overlay ("Não foi possível aplicar o recorte").

[[permission]]
identifier = "allow-capture-list-sources"
description = "Allows listing capture sources (windows and monitors)"
commands.allow = ["capture_list_sources"]

[[permission]]
identifier = "allow-capture-source"
description = "Allows capturing a window or monitor as PNG bytes"
commands.allow = ["capture_source"]

[[permission]]
identifier = "allow-capture-source-thumbnail"
description = "Allows fetching the thumbnail of a single capture source"
commands.allow = ["capture_source_thumbnail"]

[[permission]]
identifier = "allow-capture-overlay-open"
description = "Allows opening the magnetic capture overlay"
commands.allow = ["capture_overlay_open"]

[[permission]]
identifier = "allow-capture-overlay-payload"
description = "Allows reading the payload of the capture session in progress"
commands.allow = ["capture_overlay_payload"]

[[permission]]
identifier = "allow-capture-overlay-region"
description = "Allows capturing the selected region as PNG bytes"
commands.allow = ["capture_overlay_region"]

[[permission]]
identifier = "allow-capture-overlay-close"
description = "Allows closing the magnetic capture overlay"
commands.allow = ["capture_overlay_close"]
