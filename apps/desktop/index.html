<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/linvo-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linvo Desktop</title>
    <script>
      /*
       * Aplica tema/blur/reduce-motion ANTES do primeiro paint, para não
       * piscar a paleta errada. O React monta depois disso — tarde demais
       * para evitar o flash. Esta é a MESMA regra de decisão de
       * src/lib/appearance/appearance-tokens.ts + appearance-boot.ts,
       * duplicada aqui em JS puro porque um <script> síncrono não pode
       * importar um módulo ES antes do bundle carregar. Qualquer mudança
       * na regra de decisão (appearance-boot.ts) precisa ser replicada aqui.
       */
      (function () {
        var STORAGE_KEY = "linvo:appearance";
        var STORAGE_VERSION = 1;
        var DEFAULT_BLUR = "medium";
        var DEFAULT_ACCENT = "purple";
        var DEFAULT_CUSTOM_RGBA = "rgba(124, 58, 237, 1)";
        var RGBA_RE =
          /^rgba\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(0|1|0?\.\d+)\s*\)$/i;

        var prefs = null;
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          var parsed = raw ? JSON.parse(raw) : null;
          if (parsed && parsed.version === STORAGE_VERSION && parsed.prefs) {
            prefs = parsed.prefs;
          }
        } catch (e) {
          prefs = null;
        }

        var themeMode = (prefs && prefs.themeMode) || "system";
        var blurLevel = (prefs && prefs.blurLevel) || DEFAULT_BLUR;
        var accentColor = (prefs && prefs.accentColor) || DEFAULT_ACCENT;
        var customAccentRgba =
          (prefs && prefs.customAccentRgba) || DEFAULT_CUSTOM_RGBA;
        var reduceMotionPref = prefs ? prefs.reduceMotion : null;

        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var prefersReducedMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var dark =
          themeMode === "dark" || (themeMode === "system" && prefersDark);
        var reduceMotion =
          reduceMotionPref === true || reduceMotionPref === false
            ? reduceMotionPref
            : Boolean(prefersReducedMotion);

        var root = document.documentElement;
        if (dark) {
          root.classList.add("dark");
        }
        root.setAttribute("data-blur", blurLevel);
        root.setAttribute("data-accent", accentColor);
        root.setAttribute("data-reduce-motion", String(reduceMotion));

        if (accentColor === "custom") {
          var match = RGBA_RE.exec(customAccentRgba);
          if (!match) {
            match = RGBA_RE.exec(DEFAULT_CUSTOM_RGBA);
          }
          if (match) {
            var r = Number(match[1]);
            var g = Number(match[2]);
            var b = Number(match[3]);
            var a = Number(match[4]);
            if (
              r <= 255 &&
              g <= 255 &&
              b <= 255 &&
              a >= 0 &&
              a <= 1
            ) {
              var solid = "rgba(" + r + ", " + g + ", " + b + ", " + a + ")";
              var luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
              var foreground = luminance > 0.55 ? "#000000" : "#ffffff";
              var ring = "rgba(" + r + ", " + g + ", " + b + ", 0.45)";
              root.style.setProperty("--accent-active", solid);
              root.style.setProperty("--accent-active-foreground", foreground);
              root.style.setProperty("--selection", solid);
              root.style.setProperty("--selection-foreground", foreground);
              root.style.setProperty("--ring", ring);
              root.style.setProperty("--sidebar-ring", ring);
            }
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
