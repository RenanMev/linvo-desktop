packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true

minimumReleaseAgeExclude:
  - postcss@8.5.18 || 8.5.23
  - undici@7.29.0
  - nanoid@3.3.18
  - browserslist@4.28.7
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0

overrides:
  '@vitest/mocker@>=2.1.0 <4.1.11': ^4.1.11
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  browserslist@<=4.28.6: ^4.28.7
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  undici@>=7.0.0 <7.29.0: ^7.29.0
  vitest@>=2.1.0 <4.1.11: ^4.1.11
